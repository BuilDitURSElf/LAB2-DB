<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <main class="auth-card">
        <div class="eyebrow">Personal workspace</div>
        <h1>Create your account</h1>
        <p class="intro">A calmer place for the things you need to do.</p>
        <form id="registerForm" action="/api/register" method="post">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name">
            <p class="field-error" data-error-for="name"></p>
            <label for="email">Email</label>
            <input type="email" id="email" name="email">
            <p class="field-error" data-error-for="email"></p>
            <label for="password">Password</label>
            <input type="password" id="password" name="password">
            <p class="field-error" data-error-for="password"></p>
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password">
            <p class="field-error" data-error-for="confirm_password"></p>
            <button class="primary-button" type="submit">Create account</button>
        </form>
        <p id="message" class="form-message" role="alert"></p>
        <p class="register-link">Already have an account? <a href="login.html">Sign in</a></p>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
