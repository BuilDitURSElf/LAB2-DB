<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <main class="auth-card">
        <div class="eyebrow">Personal workspace</div>
        <h1>Welcome back</h1>
        <p class="intro">Sign in to pick up where you left off.</p>
        <form id="loginForm" action="/api/login" method="post">
            <label for="email">Email</label>
            <input type="email" id="email" name="email">
            <p class="field-error" data-error-for="email"></p>
            <label for="password">Password</label>
            <input type="password" id="password" name="password">
            <p class="field-error" data-error-for="password"></p>
            <button class="primary-button" type="submit">Sign in</button>
        </form>
        <p id="message" class="form-message" role="alert"></p>
        <p class="register-link">New here? <a href="register.html">Create an account</a></p>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
